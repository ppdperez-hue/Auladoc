<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>AulaDoc v0.6.6.1</title>
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--primary:#0f172a;--primary2:#1e293b;--ok:#dcfce7;--warn:#fef3c7;--bad:#fee2e2;--shadow:0 10px 30px rgba(15,23,42,.06)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;background:rgba(246,248,251,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand-wrap{display:flex;align-items:center;gap:10px}.brand-icon{width:46px;height:46px;border-radius:12px;object-fit:cover;box-shadow:0 4px 14px rgba(15,23,42,.14)}
.brand{font-size:24px;font-weight:900}.top-actions{display:flex;gap:8px;flex-wrap:wrap}main{padding:18px 18px 110px}
.hero{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-radius:24px;padding:22px;box-shadow:var(--shadow);margin-bottom:14px}.hero h1,.hero h2{margin:0 0 6px}.hero p{margin:0;color:#cbd5e1}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:20px 2px 10px}.section-head h2,.section-head h3{margin:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card.clickable{cursor:pointer;transition:.15s transform}.card.clickable:hover{transform:translateY(-1px)}.module-icon{font-size:26px}.module-title{font-weight:800;margin-top:8px}
.muted,.meta{color:var(--muted);font-size:12px}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:800}.btn.primary{background:var(--primary);color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--text)}.btn.danger{background:#fff1f2;border:1px solid #fecdd3;color:#be123c}.btn.sm{padding:7px 9px;font-size:12px}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.grow{flex:1}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;flex:1}.field label{font-size:12px;font-weight:800;color:var(--muted)}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text)}input[type="checkbox"]{width:auto}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.actions{display:flex;gap:7px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-weight:800}.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.kpi b{font-size:22px}.kpi small{display:block;color:var(--muted);margin-top:3px}
.state{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 9px;font-weight:900}.state.active.p{background:var(--ok)}.state.active.a{background:var(--bad)}.state.active.j{background:var(--warn)}
.progress{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:6px}.progress>div{height:100%;background:var(--primary)}
.notice{background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3;border-radius:14px;padding:12px;font-size:13px}.warning{background:#fffbeb;border:1px solid #fde68a;border-radius:14px;padding:12px}.dangerbox{background:#fef2f2;border:1px solid #fecaca;border-radius:14px;padding:12px}.empty{padding:22px;text-align:center;color:var(--muted)}
.bottom-actions{position:sticky;bottom:12px;display:flex;justify-content:space-between;gap:10px;background:var(--primary);color:#fff;padding:12px 14px;border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.22)}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:18px}.modal h3{margin-top:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 14px;border-radius:12px;display:none;z-index:100}
.alert-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800}.alert-info{background:#e0f2fe;color:#075985}.alert-warn{background:#fef3c7;color:#92400e}.alert-danger{background:#fee2e2;color:#991b1b}.date-display{font-variant-numeric:tabular-nums;font-weight:800}.date-input-row{display:flex;gap:8px;align-items:center}.date-mask{min-width:0;flex:1}.date-picker{width:56px;min-width:56px;padding:9px 5px;cursor:pointer}
@media(min-width:760px){main,.topbar{padding-left:28px;padding-right:28px}.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:600px){.topbar{align-items:flex-start}.top-actions{justify-content:flex-end}.brand{font-size:20px}.brand-icon{width:42px;height:42px}.grid{grid-template-columns:1fr 1fr}.actions{width:100%;justify-content:flex-end}.item{align-items:flex-start;flex-wrap:wrap}.bottom-actions{flex-direction:column;align-items:stretch}}

/* v0.6.6.1: adaptive UI */
.empty-state{padding:30px 18px;text-align:center;display:grid;justify-items:center;gap:9px;color:var(--muted)}
.empty-state .empty-icon{width:58px;height:58px;border-radius:18px;background:#f1f5f9;display:grid;place-items:center;font-size:26px}
.empty-state h3{color:var(--text);margin:2px 0 0}.empty-state p{max-width:380px;margin:0;font-size:13px;line-height:1.5}
.fab{position:fixed;right:max(20px,calc((100vw - 1180px)/2 + 22px));bottom:22px;z-index:25;border:0;background:var(--primary);color:#fff;border-radius:18px;box-shadow:0 8px 24px #0f172a45;padding:13px 17px;font-weight:800;font-size:15px}
.fab:focus-visible,.btn:focus-visible,.state:focus-visible{outline:3px solid #38bdf8;outline-offset:2px}
.fab-menu{position:fixed;right:max(20px,calc((100vw - 1180px)/2 + 22px));bottom:84px;z-index:25;display:grid;gap:7px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.fab-menu button{text-align:left;min-width:185px}
.snackbar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:110;background:#0f172a;color:#fff;display:flex;align-items:center;gap:15px;max-width:calc(100vw - 24px);padding:11px 14px;border-radius:12px;box-shadow:0 8px 30px #0f172a40;font-size:13px}
.snackbar button{color:#93c5fd;background:transparent;border:0;font-weight:800}
@media(max-width:600px){.modal-backdrop{align-items:end;padding:0}.modal{width:100%;max-height:88dvh;border-radius:22px 22px 0 0;padding:22px 18px 28px;animation:slideUp .18s ease-out}.modal:before{content:'';display:block;background:#cbd5e1;border-radius:9px;width:42px;height:5px;margin:-8px auto 18px}@keyframes slideUp{from{transform:translateY(35px);opacity:.5}to{transform:translateY(0);opacity:1}}.fab{bottom:18px;right:18px}.fab-menu{bottom:76px;right:18px}.snackbar{bottom:80px;width:calc(100vw - 32px)}}
.card.item{padding:16px;margin-bottom:12px}.card.item .grow{min-width:0;overflow-wrap:anywhere}.card.item .actions{padding:0}.section-head{flex-wrap:wrap}.exchange-tools{margin:12px 0;justify-content:flex-start!important}.agenda-gap{margin:12px 0}@media(max-width:600px){.top-actions{gap:4px}.top-actions .btn{font-size:12px;padding:8px}.fab{display:none}.card.item{padding:14px}.section-head .actions{justify-content:flex-start}} </style>
</head>
<body>
<div class="app">
<header class="topbar">
<div class="brand-wrap"><svg class="brand-icon" viewBox="0 0 64 64" aria-label="AulaDoc"><rect width="64" height="64" rx="12" fill="#0f172a"/><path d="M15 17h15v31H15zM34 17h15v31H34z" fill="#fff"/><path d="M20 25h6m-6 7h6m12-7h6m-6 7h6" stroke="#64748b" stroke-width="2"/></svg><div><div class="brand">AulaDoc</div><div class="muted">Prof. Perez P. · v0.6.6.1</div></div></div>
<div class="top-actions"><button class="btn ghost" id="btnBackup">Backup</button><button class="btn ghost" id="btnRestore">Restaurar</button><input type="file" id="restoreFile" accept=".json" hidden></div>
</header>
<main id="appView"></main>
</div>
<div id="modalRoot"></div><div id="toast" class="toast"></div><div id="uiExtras" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const DB_KEY='auladoc_v061';
const emptyDB=()=>({version:61,institutions:[],subjects:[],students:[],attendance:[],grades:[],topics:[],holidays:[],events:[]});
function db(){
 try{
   let raw=localStorage.getItem(DB_KEY);
   if(!raw){
     const legacy=localStorage.getItem('auladoc_v05');
     if(legacy){
       const parsed={...emptyDB(),...JSON.parse(legacy),version:61};
       localStorage.setItem(DB_KEY,JSON.stringify(parsed));
       return parsed;
     }
     return emptyDB();
   }
   return {...emptyDB(),...JSON.parse(raw),version:61};
 }catch{return emptyDB()}
}
function commit(v){localStorage.setItem(DB_KEY,JSON.stringify(v))}
function mutate(fn){const d=db();fn(d);commit(d);return d}
function uid(p){return `${p}_${Date.now()}_${Math.random().toString(36).slice(2,7)}`}
const $=(sel,root=document)=>root.querySelector(sel), $$=(sel,root=document)=>[...root.querySelectorAll(sel)];
const esc=(s='')=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function formatDate(iso){if(!iso)return'';const[y,m,d]=iso.split('-');return`${d}/${m}/${y}`}
function maskDate(value){const d=String(value||'').replace(/\D/g,'').slice(0,8);return d.slice(0,2)+(d.length>2?'/'+d.slice(2,4):'')+(d.length>4?'/'+d.slice(4):'')}
function dateFields(name,value){return `<div class="date-input-row"><input class="date-mask" name="${name}" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="DD/MM/AAAA" value="${value||''}" required aria-label="Fecha en día mes año"><input type="date" class="date-picker" aria-label="Elegir fecha en calendario" value="${dmyToISO(value)||''}"></div><div class="meta">Escribí los 8 números sin barras, o usá el calendario.</div>`}
function setupDateFields(root){root.querySelectorAll('.date-input-row').forEach(row=>{const text=row.querySelector('.date-mask'),picker=row.querySelector('.date-picker');text.addEventListener('input',()=>{const old=text.value;const masked=maskDate(old);text.value=masked;const iso=dmyToISO(masked);picker.value=iso||'';root.dispatchEvent(new Event('dateupdated'))});picker.addEventListener('change',()=>{text.value=picker.value?formatDate(picker.value):'';root.dispatchEvent(new Event('dateupdated'))})})}
function dmyToISO(v){const m=String(v||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(!m)return null;const d=+m[1],mo=+m[2],y=+m[3],dt=new Date(y,mo-1,d);if(dt.getFullYear()!=y||dt.getMonth()!=mo-1||dt.getDate()!=d)return null;return`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function countScheduledClasses(start,end,weekdays,excluded=[]){if(!start||!end||!weekdays?.length)return 0;const ex=new Set(excluded);let a=new Date(start+'T12:00:00'),b=new Date(end+'T12:00:00'),n=0;for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1)){const iso=d.toISOString().slice(0,10);if(weekdays.includes(d.getDay())&&!ex.has(iso))n++}return n}
function toast(msg){snackbar(msg)}
function snackbar(msg,actionLabel='',action=null){const area=$('#uiExtras');area.querySelector('.snackbar')?.remove();const bar=document.createElement('div');bar.className='snackbar';bar.setAttribute('role','status');const label=document.createElement('span');label.textContent=msg;bar.appendChild(label);if(actionLabel&&action){const b=document.createElement('button');b.type='button';b.textContent=actionLabel;b.onclick=()=>{bar.remove();action()};bar.appendChild(b)}const close=document.createElement('button');close.type='button';close.textContent='Cerrar';close.setAttribute('aria-label','Cerrar aviso');close.onclick=()=>bar.remove();bar.appendChild(close);area.appendChild(bar);clearTimeout(window.__tt);window.__tt=setTimeout(()=>bar.remove(),5500)}
function emptyState(icon,title,description,actionLabel='',action=''){return `<div class="empty-state"><div class="empty-icon" aria-hidden="true">${icon}</div><h3>${esc(title)}</h3><p>${esc(description)}</p>${action?btn(esc(actionLabel),action,'primary'):''}</div>`}
let fabOpen=false;
function renderFab(){const root=$('#uiExtras');root.querySelector('.fab')?.remove();root.querySelector('.fab-menu')?.remove();let actions=[];if(ctx.subjectId&&subject())actions=[['Nuevo alumno','newStudent'],['Cargar nota','grades'],['Tomar asistencia','attendance'],['Registrar clase','topics']];else if(ctx.institutionId&&institution())actions=[['Nueva materia','newSubject']];else actions=[['Nueva institución','newInstitution']];const fab=document.createElement('button');fab.className='fab';fab.type='button';fab.textContent=fabOpen?'× Cerrar':'+ Nuevo';fab.setAttribute('aria-label','Acciones rápidas');fab.setAttribute('aria-expanded',String(fabOpen));fab.onclick=()=>{fabOpen=!fabOpen;renderFab()};root.appendChild(fab);if(fabOpen){const menu=document.createElement('div');menu.className='fab-menu';menu.setAttribute('role','menu');actions.forEach(([label,action])=>{const b=document.createElement('button');b.type='button';b.className='btn ghost';b.textContent=label;b.onclick=()=>{fabOpen=false;renderFab();dispatchQuickAction(action)};menu.appendChild(b)});root.appendChild(menu)}}
function dispatchQuickAction(action){if(action==='newInstitution')institutionForm();else if(action==='newSubject')subjectForm();else if(action==='newStudent')studentForm();else if(action==='grades')gradesView('load');else if(action==='attendance')attendanceView('take');else if(action==='topics')topicsView('new')}

function download(name,text){const blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backup(){return JSON.stringify({app:'AulaDoc',version:63,exportedAt:new Date().toISOString(),data:db()},null,2)}
function restore(text){
 const p=JSON.parse(text);
 if(p?.app!=='AulaDoc'||!p?.data||![5,61,63].includes(Number(p.version)))throw Error();
 commit({...emptyDB(),...p.data,version:61});
}

const view=$('#appView');
let ctx={institutionId:null,subjectId:null,attendanceDraft:{},attendanceDate:null,editingAttendanceId:null};
function institution(){return db().institutions.find(x=>x.id===ctx.institutionId)}
function subject(){return db().subjects.find(x=>x.id===ctx.subjectId)}
function subjectStudents(){return db().students.filter(x=>x.subjectId===ctx.subjectId).sort((a,b)=>(a.name.localeCompare(b.name,'es',{sensitivity:'base'}))*(localStorage.getItem('adStudentOrder')==='desc'?-1:1))}
function attendanceRecords(){return db().attendance.filter(x=>x.subjectId===ctx.subjectId)}
function subjectGrades(){return db().grades.filter(x=>x.subjectId===ctx.subjectId)}
function subjectTopics(){return db().topics.filter(x=>x.subjectId===ctx.subjectId).concat(autoTopics(subject()))}
function defaultRules(s){return{attendanceWarningMargin:s?.alertRules?.attendanceWarningMargin??5,consecutiveAbsences:s?.alertRules?.consecutiveAbsences??2,gradeWarning:s?.alertRules?.gradeWarning??6,gradeCritical:s?.alertRules?.gradeCritical??4}}
function setView(h){fabOpen=false;view.innerHTML=h;renderFab();window.scrollTo(0,0)}
function btn(label,action,kind='ghost'){return`<button class="btn ${kind}" data-action="${action}">${label}</button>`}
function tabButton(label,action,active){return`<button class="tab ${active?'active':''}" data-action="${action}">${label}</button>`}
function moduleCard(icon,title,meta,action){return`<div class="card clickable" data-action="${action}"><div class="module-icon">${icon}</div><div class="module-title">${title}</div><div class="meta">${meta}</div></div>`}

function home(){const d=db();setView(`<div class="hero"><h1>Gestor docente</h1><p>Instituciones, materias, alumnos y seguimiento académico.</p></div><div class="agenda-gap">${btn("Calendario general","calendar")}${btn("Centro de alertas","allAlerts")}</div>${agendaHtml()}<div class="section-head"><h2>Instituciones</h2>${btn('+ Nueva institución','newInstitution')}</div>${d.institutions.length?d.institutions.map(i=>`<div class="card item"><div class="grow"><b>${esc(i.name)}</b><div class="meta">${esc(i.place||'Sin sede cargada')}</div></div><div class="actions">${btn('Entrar',`openInstitution:${i.id}`)}${btn('Editar',`editInstitution:${i.id}`)}${btn('Eliminar',`deleteInstitution:${i.id}`,'danger')}</div></div>`).join(''):`<div class="card">${emptyState("🏫","Sin instituciones","Creá tu primera institución para comenzar.","Crear institución","newInstitution")}</div>`}`)}
function institutionView(){const i=institution();if(!i)return home();const subs=db().subjects.filter(s=>s.institutionId===i.id);setView(`${btn('← Instituciones','home')}<div class="hero"><h2>${esc(i.name)}</h2><p>${esc(i.place||'')}</p></div><div class="section-head"><h2>Materias</h2>${btn('+ Nueva materia','newSubject')}</div>${subs.length?subs.map(s=>`<div class="card item"><div class="grow"><b>${esc(s.name)}</b><div class="meta">${esc(s.type)} · ${esc(s.regime)}${s.semester?' · '+esc(s.semester):''} · mínimo ${s.minAttendance}%</div></div><div class="actions">${btn('Abrir',`openSubject:${s.id}`)}${btn('Editar',`editSubject:${s.id}`)}${btn('Eliminar',`deleteSubject:${s.id}`,'danger')}</div></div>`).join(''):`<div class="card">${emptyState("📚","Sin materias","Agregá una materia para registrar alumnos y clases.","Nueva materia","newSubject")}</div>`}`)}
function calculateSubjectAlerts(){const s=subject();if(!s)return[];const rules=defaultRules(s),alerts=[],rec=[...attendanceRecords()].sort((a,b)=>a.date.localeCompare(b.date)),grades=subjectGrades();for(const st of subjectStudents()){let p=0,a=0,j=0,streak=0,maxStreak=0;for(const r of rec){const v=r.attendance?.[st.id];if(v==='P'){p++;streak=0}else if(v==='A'){a++;streak++;maxStreak=Math.max(maxStreak,streak)}else if(v==='J'){j++;streak=0}}const total=p+a+j,pct=total?Math.round(p/total*100):100;if(total&&pct<s.minAttendance)alerts.push({level:'danger',student:st.name,message:`Asistencia ${pct}%: debajo del mínimo de ${s.minAttendance}%.`});else if(total&&pct<s.minAttendance+rules.attendanceWarningMargin)alerts.push({level:'warn',student:st.name,message:`Asistencia ${pct}%: cerca del mínimo de ${s.minAttendance}%.`});if(maxStreak>=rules.consecutiveAbsences)alerts.push({level:'warn',student:st.name,message:`Acumula ${maxStreak} ausencias consecutivas.`});for(const g of grades.filter(g=>g.studentId===st.id)){if(g.value<rules.gradeCritical)alerts.push({level:'danger',student:st.name,message:`${g.eval}: ${g.value}, debajo del umbral crítico (${rules.gradeCritical}).`});else if(g.value<rules.gradeWarning)alerts.push({level:'warn',student:st.name,message:`${g.eval}: ${g.value}, debajo del umbral de alerta (${rules.gradeWarning}).`})}}return alerts}
function subjectView(){const s=subject();if(!s)return institutionView();const d=db(),excluded=excludedDates(s,d),estimated=countScheduledClasses(s.start,s.end,s.weekdays,excluded),allowed=Math.floor(estimated*(1-s.minAttendance/100)),alerts=calculateSubjectAlerts();setView(`${btn('← Materias','backInstitution')}<div class="hero"><h2>${esc(s.name)}</h2><p>${esc(s.type)} · ${esc(s.regime)}${s.semester?' · '+esc(s.semester):''}</p></div><div class="kpis"><div class="kpi"><b>${s.minAttendance}%</b><small>asistencia mínima</small></div><div class="kpi"><b>${estimated}</b><small>clases estimadas</small></div><div class="kpi"><b>${allowed}</b><small>faltas estimadas permitidas</small></div><div class="kpi"><b>${alerts.length}</b><small>alertas activas</small></div></div><div class="grid">${moduleCard('✓','Asistencia','Lista, atrasadas, historial y alertas','attendance')}${moduleCard('◎','Calificaciones','Carga continua, resumen y alertas','grades')}${moduleCard('≡','Libro de temas','Nueva clase e historial','topics')}${moduleCard('♙','Alumnos','Padrón y ficha individual','students')}${moduleCard('▤','Calendario','Feriados y suspensiones','calendar')}${moduleCard('⚙','Reglas','Alertas académicas configurables','rules')}${moduleCard('📁','Archivos','DCP, programa, planificación y otros','documents')}</div>${alerts.length?`<div class="section-head"><h3>Alertas de la materia</h3></div><div class="card">${alerts.slice(0,8).map(a=>`<div class="item"><div class="grow"><span class="alert-chip ${a.level==='danger'?'alert-danger':'alert-warn'}">${a.level==='danger'?'Crítico':'Atención'}</span><div style="margin-top:6px"><b>${esc(a.student)}</b></div><div class="meta">${esc(a.message)}</div></div></div>`).join('')}</div>`:''}`)}

function institutionForm(existing=null){setView(`${btn('← Volver','home')}<div class="card"><h2>${existing?'Editar':'Nueva'} institución</h2><form id="institutionForm"><div class="field"><label>Nombre</label><input name="name" value="${esc(existing?.name||'')}" required></div><div class="field"><label>Sede / anexo</label><input name="place" value="${esc(existing?.place||'')}"></div><button class="btn primary">${existing?'Guardar cambios':'Crear institución'}</button></form></div>`);$('#institutionForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),name=String(f.get('name')).trim(),place=String(f.get('place')).trim();if(!name)return;if(existing)mutate(d=>Object.assign(d.institutions.find(x=>x.id===existing.id),{name,place}));else mutate(d=>d.institutions.push({id:uid('inst'),name,place}));toast(existing?'Institución actualizada':'Institución creada');home()}}
function subjectForm(existing=null){const weekdays=existing?.weekdays||[];setView(`${btn('← Volver','backInstitution')}<div class="card"><h2>${existing?'Editar':'Nueva'} materia</h2><form id="subjectForm"><div class="field"><label>Nombre</label><input name="name" value="${esc(existing?.name||'')}" required></div><div class="row wrap"><div class="field"><label>Tipo</label><select name="type">${['Asignatura','Taller','Seminario','Práctica','Laboratorio','Módulo','Otro'].map(x=>`<option ${existing?.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Régimen</label><select name="regime" id="regimeSelect"><option ${existing?.regime==='Anual'?'selected':''}>Anual</option><option ${existing?.regime==='Cuatrimestral'?'selected':''}>Cuatrimestral</option></select></div></div><div class="field" id="semesterWrap"><label>Cuatrimestre</label><select name="semester"><option ${existing?.semester==='1.º cuatrimestre'?'selected':''}>1.º cuatrimestre</option><option ${existing?.semester==='2.º cuatrimestre'?'selected':''}>2.º cuatrimestre</option></select></div><div class="row wrap"><div class="field"><label>Inicio (DD/MM/AAAA)</label>${dateFields("start",existing?.start?formatDate(existing.start):"")}</div><div class="field"><label>Fin (DD/MM/AAAA)</label>${dateFields("end",existing?.end?formatDate(existing.end):"")}</div></div><div class="field"><label>Días de cursada</label><div class="row wrap">${[[1,'Lun'],[2,'Mar'],[3,'Mié'],[4,'Jue'],[5,'Vie'],[6,'Sáb']].map(([v,l])=>`<label><input type="checkbox" name="weekday" value="${v}" ${weekdays.includes(v)?'checked':''}> ${l}</label>`).join('')}</div></div><div class="field"><label>% mínimo de asistencia</label><input type="number" name="minAttendance" min="0" max="100" value="${existing?.minAttendance??75}" required></div><div class="notice" id="estimateBox">Completá fechas y días para calcular clases.</div><button class="btn primary">${existing?'Guardar cambios':'Crear materia'}</button></form></div>`);const form=$('#subjectForm');setupDateFields(form);const reg=$('#regimeSelect'),sem=$('#semesterWrap'),syncSem=()=>sem.style.display=reg.value==='Cuatrimestral'?'flex':'none';syncSem();reg.onchange=syncSem;const estimate=()=>{const f=new FormData(form),ds=f.getAll('weekday').map(Number),st=dmyToISO(f.get('start')),en=dmyToISO(f.get('end'));$('#estimateBox').textContent=`Clases estimadas: ${countScheduledClasses(st,en,ds,[])}`};form.oninput=estimate;form.onchange=estimate;form.addEventListener("dateupdated",estimate);estimate();form.onsubmit=e=>{e.preventDefault();const f=new FormData(form),name=String(f.get('name')).trim(),st=dmyToISO(f.get('start')),en=dmyToISO(f.get('end')),ds=f.getAll('weekday').map(Number),min=Number(f.get('minAttendance'));if(!name||!st||!en||!ds.length)return toast('Completá nombre, fechas válidas y días');if(en<st)return toast('La fecha final no puede ser anterior al inicio');if(min<0||min>100)return toast('El porcentaje debe estar entre 0 y 100');const payload={name,type:f.get('type'),regime:f.get('regime'),semester:f.get('regime')==='Cuatrimestral'?f.get('semester'):'',start:st,end:en,weekdays:ds,minAttendance:min};if(existing)mutate(d=>Object.assign(d.subjects.find(x=>x.id===existing.id),payload));else mutate(d=>d.subjects.push({id:uid('sub'),institutionId:ctx.institutionId,...payload}));toast(existing?'Materia actualizada':'Materia creada');institutionView()}}

function studentsView(){const list=subjectStudents();setView(`${btn('← Materia','backSubject')}<div class="section-head"><h2>Alumnos</h2>${btn('Orden A–Z / Z–A','sortStudents')}${exchangeBar('students')}${btn('+ Agregar','newStudent')}</div><div class="card">${list.length?list.map(s=>`<div class="item"><div class="grow"><b>${esc(s.name)}</b><div class="meta">${esc(s.legajo||'Sin legajo')}</div></div><div class="actions">${btn('Ficha',`studentCard:${s.id}`)}${btn('Editar',`editStudent:${s.id}`)}${btn('Eliminar',`deleteStudent:${s.id}`,'danger')}</div></div>`).join(''):`${emptyState("👥","Sin alumnos","Cargá tu primer alumno para comenzar a tomar asistencia.","Agregar alumno","newStudent")}`}</div>`)}
function studentForm(existing=null){setView(`${btn('← Alumnos','students')}<div class="card"><h2>${existing?'Editar':'Nuevo'} alumno</h2><form id="studentForm"><div class="field"><label>Apellido y nombre</label><input name="name" value="${esc(existing?.name||'')}" required></div><div class="field"><label>Legajo / identificación</label><input name="legajo" value="${esc(existing?.legajo||'')}"></div><button class="btn primary">${existing?'Guardar cambios':'Agregar alumno'}</button></form></div>`);$('#studentForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),name=String(f.get('name')).trim(),legajo=String(f.get('legajo')).trim();if(!name)return;if(subjectStudents().some(s=>s.id!==existing?.id&&s.name.toLowerCase()===name.toLowerCase()))return toast('Ya existe un alumno con ese nombre');if(existing)mutate(d=>Object.assign(d.students.find(x=>x.id===existing.id),{name,legajo}));else mutate(d=>d.students.push({id:uid('stu'),subjectId:ctx.subjectId,name,legajo}));studentsView()}}
function studentCard(id){const st=db().students.find(x=>x.id===id),rec=attendanceRecords(),grades=subjectGrades().filter(g=>g.studentId===id);let p=0,a=0,j=0;rec.forEach(r=>{const v=r.attendance?.[id];if(v==='P')p++;if(v==='A')a++;if(v==='J')j++});const total=p+a+j,pct=total?Math.round(p/total*100):0;setView(`${btn('← Alumnos','students')}<div class="hero"><h2>${esc(st.name)}</h2><p>${esc(st.legajo||'')}</p></div><div class="kpis"><div class="kpi"><b>${pct}%</b><small>asistencia</small></div><div class="kpi"><b>${a}</b><small>ausencias</small></div><div class="kpi"><b>${j}</b><small>justificadas</small></div><div class="kpi"><b>${grades.length}</b><small>notas cargadas</small></div></div><div class="card"><h3>Calificaciones</h3>${grades.length?grades.map(g=>`<div class="item"><div class="grow">${esc(g.eval)}</div><b>${g.value}</b></div>`).join(''):`<div class="empty">Sin notas.</div>`}</div>`)}

function attendanceView(tab='take'){if(tab==='take')prepareAttendanceDraft();setView(`${btn('← Materia','backSubject')}<h2>Asistencia</h2>${exchangeBar('attendance')}<div class="tabs">${tabButton('Tomar lista','attendanceTake',tab==='take')}${tabButton('Historial','attendanceHistory',tab==='history')}${tabButton('Resumen y alertas','attendanceSummary',tab==='summary')}</div>${tab==='take'?attendanceTakeHtml():tab==='history'?attendanceHistoryHtml():attendanceSummaryHtml()}`)}
function prepareAttendanceDraft(){if(!ctx.attendanceDate)ctx.attendanceDate=today();if(!Object.keys(ctx.attendanceDraft).length)subjectStudents().forEach(s=>ctx.attendanceDraft[s.id]='P')}
function attendanceTakeHtml(){const date=ctx.attendanceDate||today(),isPast=date<today(),st=subjectStudents();return`<div class="card"><div class="row wrap" style="justify-content:space-between"><div><div class="meta">Fecha de asistencia</div><div class="date-display">${formatDate(date)} ${isPast?'<span class="alert-chip alert-info">Atrasada</span>':''}</div></div><div class="actions">${btn(isPast?'Cambiar fecha':'Cargar asistencia atrasada','chooseAttendanceDate')}${ctx.editingAttendanceId?btn('Cancelar edición','cancelAttendanceEdit','danger'):''}</div></div>${st.length?st.map(s=>`<div class="item"><div class="grow"><b>${esc(s.name)}</b></div><div class="actions">${['P','A','J'].map(v=>`<button class="state ${ctx.attendanceDraft[s.id]===v?'active '+v.toLowerCase():''}" data-action="setAttendance:${s.id}:${v}">${v}</button>`).join('')}</div></div>`).join(''):`<div class="empty">Primero cargá alumnos.</div>`}</div><div class="bottom-actions"><div>${ctx.editingAttendanceId?'Estás corrigiendo una asistencia ya registrada.':'Si esa fecha ya existe, se actualizará y no se duplicará.'}</div>${btn(ctx.editingAttendanceId?'Guardar corrección':'Guardar asistencia','saveAttendance','primary')}</div>`}
function attendanceHistoryHtml(){const rec=[...attendanceRecords()].sort((a,b)=>b.date.localeCompare(a.date));return`<div class="card">${rec.length?rec.map(r=>{const vals=Object.values(r.attendance||{});return`<div class="item"><div class="grow"><b>${formatDate(r.date)}</b><div class="meta">${vals.filter(x=>x==='P').length} P · ${vals.filter(x=>x==='A').length} A · ${vals.filter(x=>x==='J').length} J</div></div><div class="actions">${btn('Editar',`editAttendance:${r.id}`)}${btn('Eliminar',`deleteAttendance:${r.id}`,'danger')}</div></div>`}).join(''):`${emptyState("✓","Sin asistencias","Todavía no registraste asistencia en esta materia.","Tomar lista","attendanceTake")}`}</div>`}
function attendanceSummaryHtml(){const rec=attendanceRecords(),s=subject(),d=db(),rules=defaultRules(s),excluded=excludedDates(s,d),estimated=countScheduledClasses(s.start,s.end,s.weekdays,excluded),allowed=Math.floor(estimated*(1-s.minAttendance/100));return`<div class="notice">Las justificadas se muestran separadas y, por ahora, no cuentan como presencia.</div><div class="card">${subjectStudents().map(st=>{let p=0,a=0,j=0;rec.forEach(r=>{const v=r.attendance?.[st.id];if(v==='P')p++;if(v==='A')a++;if(v==='J')j++});const total=p+a+j,pct=total?Math.round(p/total*100):0,remaining=Math.max(0,allowed-a);let chip='';if(total&&pct<s.minAttendance)chip='<span class="alert-chip alert-danger">Debajo del mínimo</span>';else if(total&&pct<s.minAttendance+rules.attendanceWarningMargin)chip='<span class="alert-chip alert-warn">Cerca del límite</span>';else if(total&&remaining<=1)chip='<span class="alert-chip alert-warn">Última falta disponible</span>';return`<div class="item"><div class="grow"><div class="row"><b>${esc(st.name)}</b>${chip}</div><div class="meta">${pct}% · ${a} ausencias · ${j} justificadas · faltas estimadas restantes ${remaining}</div><div class="progress"><div style="width:${pct}%"></div></div></div></div>`}).join('')||'<div class="empty">Sin datos.</div>'}</div>`}


function evaluations(){const s=subject();const base=s.evaluations||[{name:'Parcial 1'},{name:'Recuperatorio 1',parent:'Parcial 1'},{name:'Parcial 2'},{name:'Recuperatorio 2',parent:'Parcial 2'},{name:'Trabajo Práctico'},{name:'Integrador'},{name:'Recuperatorio del Integrador',parent:'Integrador'},{name:'Final'}];return [...base,...[...new Set(subjectGrades().map(g=>g.eval))].filter(n=>!base.some(e=>e.name===n)).map(name=>({name}))]}
function evaluationConfig(){setView(`${btn('← Calificaciones','grades')}<h2>Evaluaciones de la materia</h2><div class="card">${evaluations().map((e,i)=>`<div class="item"><div class="grow"><b>${esc(e.name)}</b><div class="meta">${e.parent?'Recupera: '+esc(e.parent):''}</div></div>${btn('Editar','evalEdit:'+i)}${btn('Quitar','evalRemove:'+i)}</div>`).join('')}</div>${btn('+ Nueva evaluación','evalNew','primary')}`)}
function evalForm(i){const list=evaluations(),old=list[i];modal(old?'Editar evaluación':'Nueva evaluación',`<div class="field"><label>Tipo</label><select name="type">${['Parcial','Trabajo Práctico','Integrador','Final','Coloquio','Proyecto','Otra'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Número (opcional)</label><input name="number" type="number" min="1" max="999"></div><div class="field"><label>Nombre personalizado (opcional, reemplaza tipo y número)</label><input name="custom" value="${esc(old?.name||'')}"></div><div class="field"><label><input type="checkbox" name="recovery"> Crear recuperatorio vinculado</label></div>`,f=>{const name=String(f.get('custom')).trim()||[f.get('type'),f.get('number')].filter(Boolean).join(' '), rec='Recuperatorio de '+name;if(list.some((x,j)=>j!==i&&x.name===name)|| (f.get('recovery')&&list.some(x=>x.name===rec)))return toast('Evaluación duplicada');if(old){list[i]={...old,name};list.forEach(x=>{if(x.parent===old.name)x.parent=name})}else list.push({name});if(f.get('recovery'))list.push({name:rec,parent:name});mutate(d=>{d.subjects.find(x=>x.id===ctx.subjectId).evaluations=list;if(old)d.grades.filter(g=>g.subjectId===ctx.subjectId&&g.eval===old.name).forEach(g=>g.eval=name)});$('#modalRoot').innerHTML='';evaluationConfig()})}
function exchangeBar(kind){return '<div class="actions exchange-tools">'+btn('Importar Excel / CSV','tableImport:'+kind)+btn('Exportar informes','tableExport:'+kind)+btn('Plantilla','template:'+kind)+btn('Exportar JSON','exportModule:'+kind)+btn('Importar JSON','importModule:'+kind)+'</div>'}
function moduleRows(kind){return db()[kind].filter(x=>x.subjectId===ctx.subjectId)}
function csvModule(kind){const st=subjectStudents(),nm=id=>st.find(x=>x.id===id)?.name||id;let rows=[];if(kind==='students')rows=[['Nombre','Legajo'],...moduleRows(kind).map(x=>[x.name,x.legajo])];if(kind==='grades')rows=[['Alumno','Evaluación','Nota'],...moduleRows(kind).map(x=>[nm(x.studentId),x.eval,x.value])];if(kind==='attendance')rows=[['Fecha','Alumno','Estado'],...moduleRows(kind).flatMap(x=>Object.entries(x.attendance).map(([id,v])=>[x.date,nm(id),v]))];if(kind==='topics')rows=[['Fecha','Clase','Contenido','Actividades'],...moduleRows(kind).map(x=>[x.date,x.number,x.content,x.activities])];const cell=v=>'"'+String(v??'').replace(/^[=+@\-]/,"'$&").replace(/"/g,'""')+'"';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download=kind+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importModule(kind){modal('Importar '+kind,`<div class="notice">Seleccioná un JSON exportado por AulaDoc. Solo se agregan registros nuevos; los existentes se conservan. Para notas y asistencia, los alumnos deben existir con el mismo nombre o legajo.</div><input type="file" id="moduleFile" accept=".json" required>`,async()=>{try{const f=$('#moduleFile').files[0];if(!f||f.size>5000000)throw Error('Archivo inválido o demasiado grande');const p=JSON.parse(await f.text());if(p.app!=='AulaDoc-module'||p.kind!==kind||!Array.isArray(p.rows))throw Error('Formato incorrecto');const d=db(),students=subjectStudents(),source=Array.isArray(p.students)?p.students:[],match=id=>{const a=source.find(x=>x.id===id);return a&&students.find(x=>a.legajo?x.legajo===a.legajo:x.name===a.name)?.id};let add=0,skip=0;for(const r of p.rows){let x={id:uid(kind),subjectId:ctx.subjectId};let duplicate=false;if(kind==='students'){if(typeof r.name!=='string'||!r.name.trim())throw Error('Nombre inválido');Object.assign(x,{name:r.name,legajo:String(r.legajo||'')});duplicate=d.students.some(y=>y.subjectId===ctx.subjectId&&(y.name===x.name||(x.legajo&&y.legajo===x.legajo)))}if(kind==='grades'){const id=match(r.studentId);if(!id||typeof r.eval!=='string'||typeof r.value!=='number'||r.value<0||r.value>10)throw Error('Nota o alumno inválido');Object.assign(x,{studentId:id,eval:r.eval,value:r.value});duplicate=d.grades.some(y=>y.subjectId===ctx.subjectId&&y.studentId===id&&y.eval===x.eval)}if(kind==='attendance'){if(!/^\d{4}-\d{2}-\d{2}$/.test(r.date)||!r.attendance)throw Error('Asistencia inválida');x.date=r.date;x.attendance={};for(const [id,v] of Object.entries(r.attendance)){const m=match(id);if(!m||!['P','A','J'].includes(v))throw Error('Alumno o estado inválido');x.attendance[m]=v}duplicate=d.attendance.some(y=>y.subjectId===ctx.subjectId&&y.date===x.date)}if(kind==='topics'){if(!/^\d{4}-\d{2}-\d{2}$/.test(r.date)||!Number.isInteger(r.number)||r.number<1||typeof r.content!=='string')throw Error('Clase inválida');Object.assign(x,{date:r.date,number:r.number,content:r.content,activities:String(r.activities||'')});duplicate=d.topics.some(y=>y.subjectId===ctx.subjectId&&(y.date===x.date||y.number===x.number))}if(duplicate)skip++;else{d[kind].push(x);add++}}if(!confirm(`Vista previa: ${add} nuevos, ${skip} duplicados omitidos. ¿Confirmar?`))return;commit(d);$('#modalRoot').innerHTML='';ctx.attendanceDraft={};subjectView();toast(`${add} importados, ${skip} omitidos`)}catch(e){toast(e.message||'Importación inválida')}})}

function gradesView(tab='load'){const st=subjectStudents();setView(`${btn('← Materia','backSubject')}<h2>Calificaciones</h2>${btn('Configurar evaluaciones','evaluationConfig')}${exchangeBar('grades')}<div class="tabs">${tabButton('Cargar','gradesLoad',tab==='load')}${tabButton('Resumen y alertas','gradesSummary',tab==='summary')}</div>${tab==='load'?`<div class="card"><form id="gradeForm"><div class="field"><label>Alumno</label><select name="student">${st.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Evaluación</label><select name="eval">${evaluations().map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Nota</label><input name="value" type="number" min="0" max="10" step=".5" required></div><div class="actions"><button class="btn primary" type="submit">Guardar y seguir cargando</button>${btn('Finalizar carga','finishGrades')}</div></form><div class="notice" style="margin-top:12px">Guardar mantiene esta pantalla abierta. Si repetís la misma evaluación del mismo alumno, la nota se actualiza.</div></div>`:gradesSummaryHtml()}`);if(tab==='load'&&$('#gradeForm'))$('#gradeForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),studentId=f.get('student'),evaluation=f.get('eval'),value=Number(f.get('value'));if(!studentId||Number.isNaN(value)||value<0||value>10)return toast('La nota debe estar entre 0 y 10');mutate(d=>{const ex=d.grades.find(g=>g.subjectId===ctx.subjectId&&g.studentId===studentId&&g.eval===evaluation);if(ex)ex.value=value;else d.grades.push({id:uid('gr'),subjectId:ctx.subjectId,studentId,eval:evaluation,value})});e.currentTarget.querySelector('[name="value"]').value='';toast('Nota guardada. Podés seguir cargando.')}}
function gradesSummaryHtml(){const grades=subjectGrades(),rules=defaultRules(subject());return`<div class="notice">Atención: nota menor a ${rules.gradeWarning}. Crítico: nota menor a ${rules.gradeCritical}. Se configura en Reglas.</div><div class="card">${subjectStudents().map(st=>{const gs=grades.filter(g=>g.studentId===st.id),low=gs.filter(g=>g.value<rules.gradeWarning),critical=gs.filter(g=>g.value<rules.gradeCritical);return`<div class="item"><div class="grow"><div class="row"><b>${esc(st.name)}</b>${critical.length?'<span class="alert-chip alert-danger">Crítico</span>':low.length?'<span class="alert-chip alert-warn">Atención</span>':''}</div><div class="meta">${gs.length?gs.map(g=>`${esc(g.eval)}: ${g.value}`).join(' · '):'Sin notas'}</div></div>${btn('Ficha',`studentCard:${st.id}`)}</div>`}).join('')||'<div class="empty">Sin alumnos.</div>'}</div><div class="notice">La condición académica definitiva seguirá viniendo de las fórmulas reales de Google Sheets.</div>`}

function topicsView(tab='new'){setView(`${btn('← Materia','backSubject')}<h2>Libro de temas</h2>${exchangeBar('topics')}<div class="tabs">${tabButton('Nueva clase','topicsNew',tab==='new')}${tabButton('Historial','topicsHistory',tab==='history')}</div>${tab==='new'?`<div class="card"><form id="topicForm"><div class="row wrap"><div class="field"><label>Fecha</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>N.º clase</label><input name="number" type="number" min="1" required></div></div><div class="field"><label>Contenido</label><textarea name="content" required></textarea></div><div class="field"><label>Actividades / observaciones</label><textarea name="activities"></textarea></div><button class="btn primary">Guardar</button></form></div>`:topicsHistoryHtml()}`);if(tab==='new')$('#topicForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),date=f.get('date'),number=Number(f.get('number')),content=String(f.get('content')).trim(),activities=String(f.get('activities')).trim();if(!content)return;if(excludedDates(subject(),db()).includes(date))return toast('Fecha sin cursado según calendario');if(subjectTopics().some(t=>t.date===date||t.number===number))return toast('Ya existe una clase con esa fecha o número');mutate(d=>d.topics.push({id:uid('top'),subjectId:ctx.subjectId,date,number,content,activities}));topicsView('history')}}
function topicsHistoryHtml(){const list=[...subjectTopics()].sort((a,b)=>(localStorage.getItem("adTopicOrder")==="asc"?1:-1)*a.date.localeCompare(b.date));return`${btn("Cambiar orden de fechas","sortTopics")}<div class="card">${list.length?list.map(t=>`<div class="item"><div class="grow"><b>${formatDate(t.date)} · ${t.automatic?"Sin cursado":"Clase "+t.number}</b><div>${esc(t.content)}</div><div class="meta">${esc(t.activities||'')}</div></div><div class="actions">${t.automatic?"Desde calendario":btn('Editar',`editTopic:${t.id}`)+btn('Eliminar',`deleteTopic:${t.id}`,'danger')}</div></div>`).join(''):`<div class="empty">Sin clases cargadas.</div>`}</div>`}

function calendarView(){const items=db().holidays.filter(h=>h.subjectId===ctx.subjectId).sort((a,b)=>a.date.localeCompare(b.date));setView(`${btn('← Materia','backSubject')}<div class="section-head"><h2>Calendario y excepciones</h2>${btn('+ Agregar fecha','newHoliday')}</div><div class="notice">Estas fechas se descuentan de la estimación de clases.</div><div class="card">${items.length?items.map(h=>`<div class="item"><div class="grow"><b>${formatDate(h.date)}</b><div class="meta">${esc(h.reason)}</div></div><div class="actions">${btn('Editar',`editHoliday:${h.id}`)}${btn('Eliminar',`deleteHoliday:${h.id}`,'danger')}</div></div>`).join(''):`${emptyState("📅","Sin excepciones","Podés agregar feriados o suspensiones de clases.","Agregar fecha","newHoliday")}`}</div>`)}
function rulesView(){const r=defaultRules(subject());setView(`${btn('← Materia','backSubject')}<h2>Reglas académicas y alertas</h2><div class="card"><form id="rulesForm"><div class="notice">Estas reglas generan avisos; no modifican por sí solas la condición académica oficial.</div><div class="field"><label>Margen preventivo de asistencia sobre el mínimo (%)</label><input name="attendanceWarningMargin" type="number" min="0" max="30" value="${r.attendanceWarningMargin}"></div><div class="field"><label>Alertar por ausencias consecutivas a partir de</label><input name="consecutiveAbsences" type="number" min="1" max="10" value="${r.consecutiveAbsences}"></div><div class="field"><label>Nota menor a la cual mostrar Atención</label><input name="gradeWarning" type="number" min="0" max="10" step=".5" value="${r.gradeWarning}"></div><div class="field"><label>Nota menor a la cual mostrar Crítico</label><input name="gradeCritical" type="number" min="0" max="10" step=".5" value="${r.gradeCritical}"></div><button class="btn primary">Guardar reglas</button></form></div>`);$('#rulesForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),rules={attendanceWarningMargin:Number(f.get('attendanceWarningMargin')),consecutiveAbsences:Number(f.get('consecutiveAbsences')),gradeWarning:Number(f.get('gradeWarning')),gradeCritical:Number(f.get('gradeCritical'))};if(rules.gradeCritical>rules.gradeWarning)return toast('El umbral crítico no puede ser mayor al de atención');mutate(d=>d.subjects.find(x=>x.id===ctx.subjectId).alertRules=rules);toast('Reglas guardadas');subjectView()}}
function safeDocumentUrl(url){try{const u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function documentsView(){const s=subject(),docs=s.documents||[];setView(`${btn('← Materia','backSubject')}<div class="section-head"><h2>Archivos de la materia</h2>${btn('+ Agregar enlace','newDocument')}</div><div class="notice">Preparado para DCP, programa, planificación, bibliografía, materiales y otros. Más adelante se vinculará con Google Drive.</div><div class="card">${docs.length?docs.map(doc=>`<div class="item"><div class="grow"><b>${esc(doc.title)}</b><div class="meta">${esc(doc.category)}${doc.url?' · enlace cargado':''}</div></div><div class="actions">${safeDocumentUrl(doc.url)?`<button class="btn ghost" data-doc-url="${esc(safeDocumentUrl(doc.url))}">Abrir</button>`:''}${btn('Editar',`editDocument:${doc.id}`)}${btn('Eliminar',`deleteDocument:${doc.id}`,'danger')}</div></div>`).join(''):`${emptyState("📁","Sin archivos","Vinculá el programa, el DCP o la planificación.","Agregar enlace","newDocument")}`}</div>`);$$('[data-doc-url]').forEach(b=>b.onclick=()=>window.open(b.dataset.docUrl,'_blank','noopener'))}

function modal(title,body,onSubmit){$('#modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal"><h3>${title}</h3><form id="modalForm">${body}<div class="actions"><button type="button" class="btn ghost" id="closeModal">Cancelar</button><button class="btn primary">Guardar</button></div></form></div></div>`;$$('#modalForm input[name=date]').forEach(input=>{if(input.type==='text'){input.maxLength=10;input.addEventListener('input',()=>input.value=maskDate(input.value))}});$('#closeModal').onclick=()=>$('#modalRoot').innerHTML='';$('#modalForm').onsubmit=e=>{e.preventDefault();onSubmit(new FormData(e.currentTarget))}}

function cascadeDeleteInstitution(id){mutate(d=>{const ids=d.subjects.filter(s=>s.institutionId===id).map(s=>s.id);d.institutions=d.institutions.filter(x=>x.id!==id);d.subjects=d.subjects.filter(x=>!ids.includes(x.id));d.students=d.students.filter(x=>!ids.includes(x.subjectId));d.attendance=d.attendance.filter(x=>!ids.includes(x.subjectId));d.grades=d.grades.filter(x=>!ids.includes(x.subjectId));d.topics=d.topics.filter(x=>!ids.includes(x.subjectId));d.holidays=d.holidays.filter(x=>!ids.includes(x.subjectId))})}
function cascadeDeleteSubject(id){mutate(d=>{d.subjects=d.subjects.filter(x=>x.id!==id);d.students=d.students.filter(x=>x.subjectId!==id);d.attendance=d.attendance.filter(x=>x.subjectId!==id);d.grades=d.grades.filter(x=>x.subjectId!==id);d.topics=d.topics.filter(x=>x.subjectId!==id);d.holidays=d.holidays.filter(x=>x.subjectId!==id)})}
function cascadeDeleteStudent(id){mutate(d=>{d.students=d.students.filter(x=>x.id!==id);d.grades=d.grades.filter(x=>x.studentId!==id);d.attendance.forEach(r=>{if(r.attendance)delete r.attendance[id]})})}

function applies(e,s){return s&&(e.scope==='all'||e.scope==='institutions'&&e.targets.includes(s.institutionId)||e.scope==='subjects'&&e.targets.includes(s.id))}
function scheduled(s,date){return s&&date>=s.start&&date<=s.end&&s.weekdays.includes(new Date(date+'T12:00:00').getDay())}
function excludedDates(s,d){return [...new Set([...d.holidays.filter(h=>h.subjectId===s.id).map(h=>h.date),...d.events.filter(e=>e.cancel&&applies(e,s)).map(e=>e.date)])]}
function autoTopics(s){if(!s)return [];const d=db();return excludedDates(s,d).filter(date=>scheduled(s,date)&&!d.topics.some(t=>t.subjectId===s.id&&t.date===date)).map(date=>({id:'auto_'+date,subjectId:s.id,date,number:null,automatic:true,content:[...d.holidays.filter(h=>h.subjectId===s.id&&h.date===date).map(h=>h.reason),...d.events.filter(e=>e.cancel&&e.date===date&&applies(e,s)).map(e=>e.title)].join(' / '),activities:'Registro automático del calendario'}))}
function agendaHtml(){const events=db().events.filter(e=>e.date>=today()&&!e.cancel).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return `<div class="card"><h3>Próximos eventos y mesas</h3>${events.slice(0,10).map(e=>`<div class="item"><div class="grow"><b>${esc(e.title)}</b><div>${formatDate(e.date)} ${esc(e.time||'')} · ${esc(e.type)}</div><div class="meta">${Math.ceil((new Date(e.date+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000)} días</div></div></div>`).join('')||'Sin eventos próximos'}</div>`}
function calendarGeneral(){const d=db();setView(`${btn('← Inicio','home')}<h2>Calendario general</h2>${btn('+ Nuevo evento','eventNew','primary')}${agendaHtml()}<div class="card">${[...d.events].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="item"><div class="grow"><b>${formatDate(e.date)} ${esc(e.time||'')} · ${esc(e.title)}</b><div class="meta">${esc(e.type)} · ${e.scope==='all'?'Todas las instituciones':esc(e.targets.map(id=>[...d.institutions,...d.subjects].find(x=>x.id===id)?.name||'Eliminada').join(', '))} · ${e.cancel?'Sin cursado':'Agenda'}</div></div>${btn('Editar','eventEdit:'+e.id)}${btn('Calendario .ics','eventICS:'+e.id)}${btn('Eliminar','eventDelete:'+e.id,'danger')}</div>`).join('')}${d.holidays.map(h=>`<div class="item"><div class="grow">${formatDate(h.date)} · ${esc(h.reason)} · ${esc(d.subjects.find(s=>s.id===h.subjectId)?.name||'')} (excepción anterior)</div>${btn('Eliminar','eventLegacyDelete:'+h.id)}</div>`).join('')}</div>`)}
function eventForm(e){const d=db();modal(e?'Editar evento':'Nuevo evento',`<div class="field"><label>Tipo</label><select name="type">${['Feriado nacional','Feriado provincial','Suspensión','Asueto','Mesa de examen','Parcial','Reunión','Otro'].map(t=>`<option ${e?.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Título / motivo</label><input name="title" required value="${esc(e?.title||'')}"></div><div class="row wrap"><div class="field"><label>Fecha</label><input name="date" type="date" required value="${e?.date||today()}"></div><div class="field"><label>Hora</label><input name="time" type="time" value="${e?.time||''}"></div></div><div class="field"><label>Alcance</label><select name="scope"><option value="all">Todas</option><option value="institutions" ${e?.scope==='institutions'?'selected':''}>Instituciones</option><option value="subjects" ${e?.scope==='subjects'?'selected':''}>Materias</option></select></div><div id="eventTargets"></div><label><input type="checkbox" name="cancel" ${e?.cancel?'checked':''}> Suspende cursado</label><div class="field"><label>Lugar / rol / observaciones</label><textarea name="notes">${esc(e?.notes||'')}</textarea></div><div class="field"><label>Recordatorios (días antes)</label>${[7,3,1,0].map(n=>`<label><input type="checkbox" name="reminder" value="${n}" ${(e?.reminders||[7,3,1,0]).includes(n)?'checked':''}> ${n===0?'Una hora antes':n+' días antes'}</label>`).join('')}</div>`,f=>{const x={id:e?.id||uid('event'),type:f.get('type'),title:String(f.get('title')).trim(),date:f.get('date'),time:f.get('time'),scope:f.get('scope'),targets:f.getAll('target'),cancel:f.has('cancel'),notes:f.get('notes'),reminders:f.getAll('reminder').map(Number)};if(!x.title||x.scope!=='all'&&!x.targets.length)return toast('Completá título y alcance');const conflicts=d.subjects.filter(s=>x.cancel&&applies(x,s)&&(d.topics.some(t=>t.subjectId===s.id&&t.date===x.date)||d.attendance.some(t=>t.subjectId===s.id&&t.date===x.date)));if(conflicts.length)return toast('Hay registros existentes en '+conflicts.map(s=>s.name).join(', ')+'. Corregilos antes de suspender.');mutate(z=>{z.events=z.events.filter(y=>y.id!==x.id);z.events.push(x)});$('#modalRoot').innerHTML='';calendarGeneral()});const form=$('#modalForm'),scope=form.elements.scope,type=form.elements.type;const targets=()=>{$('#eventTargets').innerHTML=(scope.value==='all'?[]:scope.value==='institutions'?d.institutions:d.subjects).map(z=>`<label style="display:block"><input type="checkbox" name="target" value="${z.id}" ${e?.targets.includes(z.id)?'checked':''}> ${esc(z.name)} ${z.institutionId?'— '+esc(d.institutions.find(i=>i.id===z.institutionId)?.name||''):''}</label>`).join('')};scope.onchange=targets;type.onchange=()=>{form.elements.cancel.checked=['Feriado nacional','Feriado provincial','Suspensión','Asueto'].includes(type.value);if(type.value==='Feriado nacional'){scope.value='all';targets()}};targets();if(!e)type.onchange()}
function eventICS(e){const clean=v=>String(v||'').replace(/[\r\n]/g,' ').replace(/[,;]/g,' '),date=e.date.replace(/-/g,''),start=e.time?'DTSTART:'+date+'T'+e.time.replace(':','')+'00':'DTSTART;VALUE=DATE:'+date;download('AulaDoc-evento.ics',['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//AulaDoc//Agenda//ES','BEGIN:VEVENT','UID:'+e.id+'@auladoc','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z/,'Z'),start,'SUMMARY:'+clean(e.title),'DESCRIPTION:'+clean(e.notes),...e.reminders.flatMap(n=>['BEGIN:VALARM','TRIGGER:'+(n?'-P'+n+'D':'-PT1H'),'ACTION:DISPLAY','DESCRIPTION:'+clean(e.title),'END:VALARM']),'END:VEVENT','END:VCALENDAR'].join('\r\n'))}

function allAlerts(){const old={...ctx},d=db();let rows=[];try{for(const sub of d.subjects){ctx.subjectId=sub.id;ctx.institutionId=sub.institutionId;for(const a of calculateSubjectAlerts())rows.push({...a,subject:sub.name,inst:d.institutions.find(i=>i.id===sub.institutionId)?.name||''})}}finally{Object.assign(ctx,old)}setView(btn('← Inicio','home')+'<h2>Centro general de alertas</h2><div class="card">'+(rows.map(a=>'<div class="item"><div class="grow"><b>'+esc(a.student)+'</b><div class="meta">'+esc(a.inst+' · '+a.subject)+'</div><span class="alert-chip '+(a.level==='danger'?'alert-danger':'alert-warn')+'">'+esc(a.message)+'</span></div></div>').join('')||'Sin alertas académicas')+'</div>')}
const tableHeaders={students:['Nombre','Legajo'],grades:['Alumno','Evaluación','Nota'],attendance:['Fecha','Alumno','Estado'],topics:['Fecha','Clase','Contenido','Actividades']};
function tableData(k){const st=subjectStudents(),nm=id=>st.find(x=>x.id===id)?.name||id;let rows=moduleRows(k);return [tableHeaders[k],...(k==='students'?st.map(x=>[x.name,x.legajo]):k==='grades'?rows.map(x=>[nm(x.studentId),x.eval,x.value]):k==='attendance'?rows.flatMap(x=>Object.entries(x.attendance).map(([id,v])=>[x.date,nm(id),v])):rows.map(x=>[x.date,x.number,x.content,x.activities]))]}
function csvSave(name,rows){const cell=v=>'"'+String(v??'').replace(/^[=+@-]/,m=>"'"+m).replace(/"/g,'""')+'"';download(name,'\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n'))}
function templateExport(k){csvSave('Plantilla-'+k+'.csv',[tableHeaders[k]])}
function tableExport(k){modal('Exportar informe','<div class="field"><label>Formato</label><select name="format"><option value="xlsx">Excel (.xlsx)</option><option value="csv">CSV</option><option value="pdf">PDF / imprimir</option></select></div>',f=>{const rows=tableData(k),fmt=f.get('format');if(fmt==='csv')csvSave(k+'.csv',rows);else if(fmt==='xlsx'){if(!window.XLSX)return toast('Biblioteca Excel no disponible. Probá CSV.');const w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet(rows),k);XLSX.writeFile(w,k+'.xlsx')}else{const w=window.open('','_blank');if(!w)return toast('Permití ventanas emergentes');w.document.write('<html><head><title>Informe AulaDoc</title><style>body{font:14px Arial}table{border-collapse:collapse;width:100%}td,th{border:1px solid #aaa;padding:6px}th{background:#eee}</style></head><body><h1>'+esc(institution()?.name||'')+'</h1><h2>'+esc(subject()?.name||'')+' — '+esc(k)+'</h2><p>Prof. Perez P.</p><table>'+rows.map((r,i)=>'<tr>'+r.map(v=>'<'+(i?'td':'th')+'>'+esc(String(v??''))+'</'+(i?'td':'th')+'>').join('')+'</tr>').join('')+'</table></body></html>');w.document.close();w.print()}$('#modalRoot').innerHTML=''})}
function tableImport(k){const sid=ctx.subjectId;modal('Importar · Paso 1 de 3','<p>Seleccioná Excel o CSV con encabezados en la primera fila.</p><input id="tableFile" type="file" accept=".xlsx,.csv" required>',async()=>{try{const f=$('#tableFile').files[0];if(!f||f.size>5000000)throw Error('Archivo inválido o mayor a 5 MB');if(!window.XLSX)throw Error('Biblioteca Excel no disponible');const w=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:false});const rows=XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{header:1,defval:'',raw:false});if(rows.length<2||rows.length>10001)throw Error('Archivo vacío o demasiado extenso');const h=rows.shift();modal('Importar · Paso 2 de 3','<p>Relacioná las columnas.</p>'+tableHeaders[k].map((n,i)=>'<div class="field"><label>'+esc(n)+'</label><select name="c'+i+'"><option value="-1">No asignada</option>'+h.map((v,j)=>'<option value="'+j+'" '+(String(v).trim().toLowerCase()===n.toLowerCase()?'selected':'')+'>'+esc(String(v))+'</option>').join('')+'</select></div>').join(''),form=>{const ix=tableHeaders[k].map((_,i)=>Number(form.get('c'+i)));const mapped=rows.filter(r=>r.some(v=>String(v).trim())).map(r=>ix.map(i=>i<0?'':String(r[i]??'').trim()));tablePreview(k,sid,mapped)})}catch(e){toast(e.message)}})}
function tablePreview(k,sid,rows){const d=db(),st=d.students.filter(x=>x.subjectId===sid),errors=[],norm=v=>String(v).trim().toLocaleLowerCase('es'),find=v=>{const m=st.filter(x=>norm(x.name)===norm(v)||(x.legajo&&norm(x.legajo)===norm(v)));return m.length===1?m[0].id:null},date=v=>{const x=/^\d{4}-\d{2}-\d{2}$/.test(v)?v:dmyToISO(v);return x&&new Date(x+'T00:00:00Z').toISOString().slice(0,10)===x?x:null};let added=0,skipped=0;rows.forEach((r,i)=>{try{let x={id:uid(k),subjectId:sid},dup=false;if(k==='students'){if(!r[0])throw Error('Nombre vacío');Object.assign(x,{name:r[0],legajo:r[1]});dup=d.students.some(y=>y.subjectId===sid&&(norm(y.name)===norm(x.name)||(x.legajo&&y.legajo===x.legajo)))}else if(k==='grades'){const id=find(r[0]),v=Number(r[2].replace(',','.'));if(!id||!r[1]||!r[2]||!Number.isFinite(v)||v<0||v>10)throw Error('Alumno, evaluación o nota inválida');Object.assign(x,{studentId:id,eval:r[1],value:v});dup=d.grades.some(y=>y.subjectId===sid&&y.studentId===id&&y.eval===x.eval)}else if(k==='topics'){const dt=date(r[0]),n=Number(r[1]);if(!dt||!Number.isInteger(n)||n<1||!r[2])throw Error('Fecha, clase o contenido inválido');Object.assign(x,{date:dt,number:n,content:r[2],activities:r[3]});dup=d.topics.some(y=>y.subjectId===sid&&(y.date===dt||y.number===n))}else{const dt=date(r[0]),id=find(r[1]),v=r[2].toUpperCase();if(!dt||!id||!['P','A','J'].includes(v))throw Error('Fecha, alumno o estado inválido');const old=d.attendance.find(y=>y.subjectId===sid&&y.date===dt);if(old){if(old.attendance[id]!==undefined)skipped++;else{old.attendance[id]=v;added++}return}Object.assign(x,{date:dt,attendance:{[id]:v}})}if(dup)skipped++;else{d[k].push(x);added++}}catch(e){errors.push('Fila '+(i+2)+': '+e.message)}});modal('Importar · Paso 3 de 3','<p>'+added+' nuevos · '+skipped+' duplicados omitidos · '+errors.length+' errores</p><div style="max-height:180px;overflow:auto">'+errors.slice(0,30).map(esc).join('<br>')+'</div><div style="overflow:auto"><table>'+rows.slice(0,10).map(r=>'<tr>'+r.map(v=>'<td style="padding:5px">'+esc(v)+'</td>').join('')+'</tr>').join('')+'</table></div><p>No se reemplazarán registros existentes.</p>',()=>{if(ctx.subjectId!==sid)return toast('Cambió la materia');if(errors.length)return toast('Corregí los errores antes de importar');commit(d);ctx.attendanceDraft={};$('#modalRoot').innerHTML='';subjectView();toast(added+' registros incorporados')})}
home();
